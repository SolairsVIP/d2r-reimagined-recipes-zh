name: 发布中文配方图鉴

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 验证数据和搜索
        run: |
          python -m unittest discover -s tests -v
          node --test tests/search.test.js
      - name: 整理静态文件
        run: |
          mkdir -p _site/data
          cp index.html styles.css lib.js app.js _site/
          cp data/recipes.js data/recipes.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
